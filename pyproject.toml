[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "video-frame-cutter"
version = "0.1.0"
description = "Local video frame annotation, cropping and export desktop application"
requires-python = ">=3.14,<3.15"
dependencies = [
    "PySide6>=6.10,<7",
    "av>=16,<19",
    "numpy>=2.3,<3",
    "scikit-image>=0.26,<0.27",
    "Pillow>=12,<13",
    "python-pptx>=1.0.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-qt>=4.5", "ruff>=0.14"]

[project.gui-scripts]
video-frame-cutter = "video_frame_cutter.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
target-version = "py314"
line-length = 100
